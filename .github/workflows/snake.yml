name: Contribution route

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/fleet-snake.svg?color_snake=#0e7490&color_dots=#ebedf0,#99f6e4,#2dd4bf,#0d9488,#115e59
            dist/fleet-snake-dark.svg?palette=github-dark&color_snake=#fbbf24&color_dots=#0b2530,#134e4a,#0f766e,#14b8a6,#5eead4

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
