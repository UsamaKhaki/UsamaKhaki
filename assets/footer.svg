<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="90" viewBox="0 0 1000 90" role="img" aria-label="Route line with a moving vehicle marker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061018"/>
      <stop offset="1" stop-color="#0a1a24"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#14303b" stroke-width="1"/>
    </pattern>
    <path id="route" d="M40 45 C 200 15, 330 75, 500 45 S 800 15, 960 45"/>
  </defs>
  <rect width="1000" height="90" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="90" rx="14" fill="url(#grid)"/>
  <use href="#route" fill="none" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="4 8"/>
  <circle cx="40" cy="45" r="5" fill="#5eead4"/>
  <circle cx="960" cy="45" r="5" fill="#5eead4"/>
  <circle cx="960" cy="45" r="6" fill="none" stroke="#5eead4"><animate attributeName="r" values="6;22" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle r="5" fill="#fbbf24"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
  <text x="500" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#5eead4">NEXT STOP · YOUR TEAM</text>
  <rect x="0.5" y="0.5" width="999" height="89" rx="14" fill="none" stroke="#14303b"/>
</svg>
